<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verdix AI</title>
  <meta name="description" content="Chateá con Verdix AI y obtené respuestas al instante." />
  <meta name="theme-color" content="#04070a" />
  <link rel="icon" type="image/png" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta property="og:title" content="Verdix AI" />
  <meta property="og:description" content="Chateá con Verdix AI y obtené respuestas al instante." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="assets/icons/icon-512.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    /* Sesión / auth en header */
    .auth-row {
      display: flex; align-items: center; gap: 10px; margin-left: 16px;
    }
    .user-info { display: none; align-items: center; gap: 8px; font-size: 0.88rem; color: var(--muted); }
    .user-info .avatar { width: 28px; height: 28px; border-radius: 50%; overflow: hidden; border: 1px solid var(--panel-border); }
    .user-info .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .btn-ghost { font-size: 0.85rem; padding: 6px 12px; }
    /* Toast */
    #toast {
      position: fixed; left: 50%; bottom: 28px; z-index: 200;
      transform: translate(-50%, 20px); max-width: min(520px, calc(100% - 32px));
      padding: 14px 20px; border-radius: 14px; border: 1px solid rgba(0, 255, 65, 0.35);
      background: rgba(6, 16, 12, 0.96); color: var(--text); font-size: 0.9rem;
      text-align: center; box-shadow: var(--shadow), 0 0 30px rgba(0, 255, 65, 0.15);
      opacity: 0; pointer-events: none; transition: opacity 0.25s ease, transform 0.25s ease;
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    /* Imagen generada */
    .msg img.generated-img {
      max-width: 100%; border-radius: 12px; margin-top: 10px;
      box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="index.html"><span class="brand-mark">∞</span> VERDIX</a>
      <div class="auth-row">
        <button class="btn btn-ghost" id="btn-google-login" onclick="verdixAI.login()">Iniciar con Google</button>
        <div class="user-info" id="user-info"></div>
      </div>
      <button class="nav-toggle" aria-label="Abrir menú" aria-expanded="false">☰</button>
      <nav class="nav">
        <a href="index.html">Inicio</a>
        <a href="browser.html">Browser</a>
        <a href="search.html">Search</a>
        <a href="ai.html" class="active">AI</a>
        <a href="download.html">Descargas</a>
        <a href="index.html#os">OS</a>
      </nav>
    </div>
  </header>

  <main class="tool-page">
    <div class="wrap" style="max-width:820px">
      <div class="tool-head">
        <span class="eyebrow">Verdix AI · Beta</span>
        <h1>Preguntá lo que quieras.</h1>
        <p>Tu asistente futurista, listo para ayudarte. Podés pedir imágenes, código, comandos y más.</p>
      </div>

      <div class="panel">
        <div class="chat">
          <div class="chat-log" id="chat-log">
            <div class="msg bot">
              <div class="avatar">∞</div>
              <div class="bubble">¡Hola! Soy Verdix AI. ¿En qué puedo ayudarte?</div>
            </div>
          </div>

          <form class="chat-input" id="chat-form">
            <textarea id="chat-text" rows="1" placeholder="Escribí tu mensaje (ej: 'generar una imagen de un gato cyberpunk')..." aria-label="Mensaje"></textarea>
            <button class="send-btn" type="submit" id="send-btn" aria-label="Enviar">➤</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <div id="toast"></div>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <a class="brand" href="index.html"><span class="brand-mark">∞</span> VERDIX</a>
      <div class="footer-links">
        <a href="browser.html">Browser</a>
        <a href="search.html">Search</a>
        <a href="ai.html">AI</a>
        <a href="download.html">Descargas</a>
        <a href="index.html#os">OS</a>
      </div>
      <span>© <span data-year>2026</span> Verdix.</span>
    </div>
  </footer>

  <script src="assets/js/app.js"></script>
  <script src="assets/js/ai.js"></script>
</body>
</html>
